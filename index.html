<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site indisponível</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .box {
      width: min(640px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border: 1px solid rgba(245,158,11,0.7);
      background: rgba(245,158,11,0.1);
      color: var(--accent);
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="badge">Sistema em pausa</div>
    <h1>Site temporariamente indisponível</h1>
    <p>Este site foi desativado no momento e será reativado assim que estiver pronto para voltar ao ar.</p>
  </main>
</body>
</html>
